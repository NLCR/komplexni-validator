//build.gradle starts here
plugins {
    id 'java'
}

// Create a JAR task
jar {
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA"
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
    manifest {
        attributes('Main-Class': 'nkp.pspValidator.shared.Main')
    }
    archiveFileName = "sharedModule-${project.version}.jar"
}

dependencies {
    //pozor: nepoužívat 'implementation', protože to poslední verze javafx pluginu neumí
    //TODO: still relevant?
    //https://github.com/FibreFoX/javafx-gradle-plugin/issues/116#issuecomment-376924075
    testImplementation 'junit:junit:4.13.1'
    implementation group: 'com.mycila', name: 'mycila-xmltool', version: '4.4.ga'
    // https://mvnrepository.com/artifact/com.github.nradov/abnffuzzer
    // compile group: 'com.github.nradov', name: 'abnffuzzer', version: '0.1.11'
    implementation 'commons-codec:commons-codec:1.10'
    // SAXON - if xpath 2.0 was needed eventually
    // https://mvnrepository.com/artifact/net.sf.saxon/Saxon-HE
    //compile group: 'net.sf.saxon', name: 'Saxon-HE', version: '9.7.0-14'
    implementation 'org.json:json:20180813'

    // https://mvnrepository.com/artifact/com.ibm.icu/icu4j
    implementation 'com.ibm.icu:icu4j:51.1'
}

// Verze aplikace a datum buildu pro nkp.pspValidator.shared.Version: jedinym zdrojem verze je appVersion
// v gradle.properties. Soubor se generuje do build/ (ne do src/, v gitu neni). Datum se bere az pri behu tasku
// a task neni nikdy up-to-date (je levny), aby datum buildu nezustalo stare ani s configuration cache.
def versionResourcesDir = layout.buildDirectory.dir('generated/resources/version')
def generateVersionProperties = tasks.register('generateVersionProperties') {
    def appVersion = project.version.toString()
    inputs.property('appVersion', appVersion)
    outputs.dir(versionResourcesDir)
    outputs.upToDateWhen { false }
    doLast {
        def today = java.time.LocalDate.now()
        def buildDate = "${today.dayOfMonth}. ${today.monthValue}. ${today.year}"
        def buildDateIso = today.toString()
        def file = versionResourcesDir.get().file('nkp/pspValidator/shared/version.properties').asFile
        file.parentFile.mkdirs()
        file.text = "# generovano Gradle (modules/sharedModule/build.gradle), needitovat\n" +
                "version=${appVersion}\n" +
                "buildDate=${buildDate}\n" +
                "buildDateIso=${buildDateIso}\n"
    }
}
sourceSets.main.resources.srcDir(generateVersionProperties)

// Testy nevolaji Resolver URN:NBN (pravidlo MODS_IDENTIFIERS_URN_NBN_REGISTERED skonci INFO "preskocena"):
// testy bezi bez site a nezavisi na stavu cizich identifikatoru v produkcnim Resolveru.
// Viz VfCheckUrnNbnIdentifiersRegistered.PROP_SKIP_RESOLVER.
tasks.withType(Test).configureEach {
    systemProperty 'kv.skipUrnNbnResolver', 'true'
    // pregenerovani golden protokolu (ProtocolGoldenTest): ./gradlew :modules:sharedModule:test --tests '*ProtocolGoldenTest' -Dkv.updateGolden=true
    if (System.getProperty('kv.updateGolden') != null) {
        systemProperty 'kv.updateGolden', System.getProperty('kv.updateGolden')
    }
}

// Cesty k externim nastrojum (adresar s nastrojem) pro testy se skutecnymi nastroji: VfCheckBinaryFilesValidByExternalUtilTest
// (obrazove, veraPDF, EPUBCheck), EpubWithToolsTest (veraPDF, EPUBCheck), AudioMasterCopyToolsTest (JHOVE, shntool), napr.
// ./gradlew :modules:sharedModule:test --tests '*VfCheckBinaryFilesValidByExternalUtilTest' -Djhove.path=/opt/jhove
// Bez nich se nastroj hleda v PATH; kdyz chybi, testy nastroje se preskoci.
tasks.withType(Test).configureEach {
    ['jpylyzer.path', 'jhove.path', 'kakadu.path', 'imagemagick.path', 'verapdf.path', 'epubcheck.path', 'shntool.path'].each { prop ->
        if (System.getProperty(prop) != null) {
            systemProperty prop, System.getProperty(prop)
        }
    }
}

tasks.register('run', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('nkp.pspValidator.shared.Main')
}

tasks.register('runWithTestArgs', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('nkp.pspValidator.shared.Main')
    args = ['arg1', 'arg2']
}

compileJava.options.encoding = 'UTF-8'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

