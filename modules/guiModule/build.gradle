shadowJar.dependsOn printRuntimeClasspath

def validatorConfigSourceDir = project(':modules:sharedModule').layout.projectDirectory.dir('src/main/resources/nkp/pspValidator/shared/validatorConfig')

// Vstup pro jpackage (--input): jen aktuální shadow jar a validatorConfig. Sync smaže vše ostatní, takže se do instalace
// nedostanou jary starších verzí ani obyčejný jar z build/libs.
def jpackageInputDir = layout.buildDirectory.dir('jpackage-input')
tasks.register('syncValidatorConfigForJpackage', Sync) {
    from(tasks.named('shadowJar'))
    from(validatorConfigSourceDir) {
        into 'validatorConfig'
    }
    into jpackageInputDir
}

/*
 * jpackage: instalátor nebo portable aplikace GUI (podrobně release.md kap. 4). V tomto souboru se před buildem nic
 * ručně nemění: typ balíčku, ikona a volby se volí podle OS, na kterém Gradle běží.
 *
 *   ./gradlew :modules:guiModule:jpackage                            instalátor (Windows exe, macOS dmg; Linux app-image)
 *   ./gradlew :modules:guiModule:jpackage -PjpackageType=app-image   portable aplikace, zabalená do zipu
 *   -PjpackageType=exe|msi|dmg|pkg|app-image                         jiný typ než výchozí
 *   (na Windows gradlew.bat místo ./gradlew)
 *
 * Požadavky: Windows: JDK 17 x64 (např. Temurin) a WiX Toolset 3.14 na PATH (candle.exe, light.exe; jpackage 17
 * neumí WiX 4/5). macOS: JDK 17 arm64 pro Apple Silicon (x64 JDK dá balík pro Intel). jpackage se bere z JAVA_HOME,
 * když je nastavená, jinak z PATH. Balík je vždy pro OS a architekturu stroje, na kterém se staví (shadow jar obsahuje
 * nativní knihovny JavaFX jen pro tuto platformu).
 *
 * Výstup v build/jpackage/, pojmenovaný podle release.md (tag v<appVersion>), např.
 * KomplexniValidatorGUI-v2.9_Windows_x86_64_installer.exe nebo KomplexniValidatorGUI-v2.9_Windows_x86_64_portable.zip.
 */

// Pevný UpgradeCode instalátoru pro Windows. NESMÍ SE MĚNIT: podle něj Windows Installer pozná, že jde o tentýž produkt,
// a při instalaci vyšší verze starou odinstaluje. S jiným UUID by zůstaly nainstalované dvě verze vedle sebe.
// Hodnota je ta, kterou jpackage 17 odvozoval sám bez --win-upgrade-uuid a bez --vendor
// (UUID.nameUUIDFromBytes("UpgradeCode/Unknown/KomplexniValidator"), WinMsiBundler.getUpgradeCode), takže na ni navazují
// i instalace z dřívějších verzí, které vznikly bez této volby. Po přidání --vendor by se odvozená hodnota změnila,
// proto je zapsaná napevno.
def WIN_UPGRADE_UUID = 'ee66a593-8af0-330e-8ca6-6eba6842a038'

// Údaje v instalátoru (Windows „Programy a funkce“, vlastnosti exe). Bez diakritiky: jpackage 17 předává texty do WiX
// s kódovou stránkou 1252 (MsiInstallerStrings_en.wxl), znaky jako Č, č, ů v ní nejsou a light.exe by skončil chybou
// LGHT0311. Název skupiny v nabídce Start obsahuje jen í a á, ty v 1252 jsou.
def JPACKAGE_VENDOR = 'Narodni knihovna CR'
def JPACKAGE_DESCRIPTION = 'Komplexni validator baliku PSP'
def WIN_MENU_GROUP = 'Komplexní validátor'

tasks.register('jpackage', Exec) {
    group = 'distribution'
    description = 'Sestaví instalátor nebo portable aplikaci GUI přes jpackage (viz komentář v build.gradle a release.md).'
    dependsOn 'shadowJar', 'syncValidatorConfigForJpackage'

    def appName = 'KomplexniValidator'
    def outputDir = layout.buildDirectory.dir('jpackage').get().asFile
    def inputDir = jpackageInputDir.get().asFile
    def appVersionString = project.version.toString()
    def tag = "v${appVersionString}"
    def mainJarName = "guiModule-${appVersionString}-shadow.jar"
    def mainClassName = 'nkp.pspValidator.gui.Launcher'
    def requestedType = project.findProperty('jpackageType')

    // nastaví se v doFirst, používá doLast
    def packageType = null
    def appVersionNumeric = null
    def platformLabel = null

    doFirst {
        String osName = System.getProperty('os.name').toLowerCase()
        String osArch = System.getProperty('os.arch').toLowerCase()
        String iconPath
        List<String> platformOptions = []
        if (osName.startsWith('windows')) {
            iconPath = 'src/main/resources/img/appIcon/appIcon.ico'
            packageType = 'exe'
            platformLabel = (osArch == 'amd64' || osArch == 'x86_64') ? 'Windows_x86_64' : "Windows_${osArch}"
            // instalace pro uživatele do %LOCALAPPDATA%\KomplexniValidator bez práv správce, s volbou adresáře,
            // zástupci v nabídce Start a na ploše (dialog se zeptá, zda je vytvořit)
            platformOptions = ['--win-per-user-install', '--win-dir-chooser',
                               '--win-menu', '--win-menu-group', WIN_MENU_GROUP,
                               '--win-shortcut', '--win-shortcut-prompt',
                               '--win-upgrade-uuid', WIN_UPGRADE_UUID]
        } else if (osName.startsWith('linux')) {
            // stejná ikona jako v tools/release/docker-build-linux.sh
            iconPath = 'src/main/resources/img/appIcon/appIcon-256.png'
            packageType = 'app-image'
            platformLabel = (osArch == 'amd64' || osArch == 'x86_64') ? 'Linux_x64' : "Linux_${osArch}"
        } else if (osName.startsWith('mac')) {
            iconPath = 'src/main/resources/img/appIcon/appIcon.icns'
            // dmg: uživatel přetáhne aplikaci do Aplikací, nepotřebuje práva správce (pkg je vyžaduje)
            packageType = 'dmg'
            platformLabel = osArch == 'aarch64' ? 'macOS_AppleSilicon' : 'macOS_Intel'
            platformOptions = ['--mac-package-identifier', 'cz.nkp.pspValidator.gui']
        } else {
            throw new GradleException("jpackage: nepodporovaný operační systém '${System.getProperty('os.name')}', " +
                    "podporované jsou Windows, macOS a Linux.")
        }
        if (requestedType != null) {
            packageType = requestedType.toString()
            if (!(packageType in ['exe', 'msi', 'dmg', 'pkg', 'app-image'])) {
                throw new GradleException("jpackage: neznámý typ -PjpackageType=${packageType}, povolené: exe, msi, dmg, pkg, app-image.")
            }
        }
        // volby instalátoru nejdou s app-image
        if (packageType == 'app-image') {
            def withoutWin = []
            for (int i = 0; i < platformOptions.size(); i++) {
                String opt = platformOptions[i]
                if (opt.startsWith('--win-')) {
                    // volby s hodnotou: hodnotu vynechat taky
                    if (opt in ['--win-menu-group', '--win-upgrade-uuid']) {
                        i++
                    }
                } else {
                    withoutWin << opt
                }
            }
            platformOptions = withoutWin
        }

        // jpackage chce číselnou verzi x.y.z: "2.9" -> "2.9.0", "2.9-beta" -> "2.9.0", "2.9.1" -> "2.9.1".
        // Omezení MSI (Windows): stejná verze znamená „už nainstalováno“, beta a finální verze téže verze mají stejné
        // číslo a liší se jen obsahem; před instalací finální verze přes betu je proto nutné betu odinstalovat.
        // macOS (CFBundleVersion) i Windows (MSI) přijímají tři složky, první musí být nenulová.
        def m = appVersionString =~ /^(\d+)(?:\.(\d+))?(?:\.(\d+))?/
        if (!m.find()) {
            throw new GradleException("jpackage: appVersion '${appVersionString}' nezačíná číslem verze.")
        }
        appVersionNumeric = [m.group(1), m.group(2) ?: '0', m.group(3) ?: '0'].join('.')

        String javaHome = System.getenv('JAVA_HOME')
        String exeSuffix = osName.startsWith('windows') ? '.exe' : ''
        String jpackageBin = (javaHome != null && !javaHome.isEmpty()) ? new File(javaHome, "bin/jpackage${exeSuffix}").path : 'jpackage'
        def versionOut = new ByteArrayOutputStream()
        project.exec {
            commandLine jpackageBin, '--version'
            standardOutput = versionOut
        }
        println "jpackage: ${jpackageBin} (verze ${versionOut.toString().trim()}), typ ${packageType}, app-version ${appVersionNumeric}"

        // starý výstup téhož typu smazat, jinak jpackage nebo přejmenování skončí chybou na existujícím cíli;
        // výstupy jiných typů (např. instalátor vedle portable) zůstávají
        String prefix = "KomplexniValidatorGUI-${tag}_${platformLabel}"
        if (packageType == 'app-image') {
            project.delete(new File(outputDir, appName), new File(outputDir, "${appName}.app"),
                    new File(outputDir, "${prefix}_portable"), new File(outputDir, "${prefix}_portable.zip"))
        } else {
            project.delete(new File(outputDir, "${appName}-${appVersionNumeric}.${packageType}"),
                    new File(outputDir, "${prefix}_installer.${packageType}"))
        }

        commandLine([jpackageBin,
                     '--type', packageType,
                     '--dest', outputDir.path,
                     '--name', appName,
                     '--vendor', JPACKAGE_VENDOR,
                     '--description', JPACKAGE_DESCRIPTION,
                     '--input', inputDir.path,
                     '--main-jar', mainJarName,
                     '--main-class', mainClassName,
                     '--icon', iconPath,
                     '--app-version', appVersionNumeric] + platformOptions)
    }

    // pojmenování výstupu podle release.md
    doLast {
        String prefix = "KomplexniValidatorGUI-${tag}_${platformLabel}"
        if (packageType == 'app-image') {
            File zipFile = new File(outputDir, "${prefix}_portable.zip")
            if (platformLabel.startsWith('macOS')) {
                // .app musí zůstat pojmenovaná KomplexniValidator.app (jinak ji Finder nebere jako aplikaci),
                // do zipu jde tak, jak je
                File app = new File(outputDir, "${appName}.app")
                project.exec {
                    workingDir outputDir
                    // -y: symlinky v runtime zachovat jako symlinky
                    commandLine 'zip', '-qry', zipFile.name, app.name
                }
                println "jpackage: ${app} a ${zipFile}"
            } else {
                File dir = new File(outputDir, "${prefix}_portable")
                if (!new File(outputDir, appName).renameTo(dir)) {
                    throw new GradleException("jpackage: nelze přejmenovat ${appName} na ${dir.name}")
                }
                if (platformLabel.startsWith('Windows')) {
                    ant.zip(destfile: zipFile, basedir: outputDir, includes: "${dir.name}/**")
                } else {
                    project.exec {
                        workingDir outputDir
                        commandLine 'zip', '-qry', zipFile.name, dir.name
                    }
                }
                println "jpackage: ${dir} a ${zipFile}"
            }
        } else {
            File built = new File(outputDir, "${appName}-${appVersionNumeric}.${packageType}")
            File target = new File(outputDir, "${prefix}_installer.${packageType}")
            if (!built.renameTo(target)) {
                throw new GradleException("jpackage: nenalezen výstup ${built} nebo ho nelze přejmenovat na ${target.name}")
            }
            println "jpackage: ${target}"
        }
    }
}

//run - spusti GUI
//./gradlew :modules:guiModule:run

//jpackage - build instalatoru nebo portable aplikace (viz komentar u ulohy jpackage)
//./gradlew :modules:guiModule:jpackage [-PjpackageType=app-image]


//build.gradle ends here

//runSnapshots - otevre dialogy GUI a ulozi jejich snimky do PNG (kontrola vzhledu, viz SnapshotMode)
//./gradlew :modules:guiModule:runSnapshots -PsnapshotDir=/tmp/snap [-Psnapshot=main,pspDir,pspZip] [-PsnapshotDelayMs=800]
tasks.register('runSnapshots', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('nkp.pspValidator.gui.Launcher')
    def dir = project.findProperty('snapshotDir') ?: "${rootDir}/build/gui-snapshots"
    systemProperty 'kv.snapshotDir', dir
    if (project.hasProperty('snapshot')) {
        systemProperty 'kv.snapshot', project.property('snapshot')
    }
    if (project.hasProperty('snapshotDelayMs')) {
        systemProperty 'kv.snapshotDelayMs', project.property('snapshotDelayMs')
    }
    if (project.hasProperty('maxDialogHeight')) { //simulace mensiho displeje
        systemProperty 'kv.maxDialogHeight', project.property('maxDialogHeight')
    }
}
