allprojects {
    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17) // Fixed to Java 17 for compilation. Java 21 for runtime
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    version '2.6.1'
    //sourceCompatibility = '17'
    //targetCompatibility = '17'

    repositories {
        mavenCentral()
    }

    dependencies {
        //testImplementation 'junit:junit:4.13.1'
    }
}

