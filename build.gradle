apply from: 'gradle/app-version.gradle'
// appVersion musí odpovídat konvenci (běh bez appVersion má verzi 0.0.0 a nekontroluje se)
if (findProperty('appVersion') != null) {
    parseAppVersion(findProperty('appVersion').toString())
}

allprojects {
    repositories {
        mavenCentral()
    }
    group = 'nkp.pspValidator'
    version = findProperty('appVersion') ?: '0.0.0'
}

subprojects {
    apply plugin: 'java'

    // Kompilace pro Javu 17 (CLI a GUI zip bezi na Jave 17+), ale bez toolchainu: build jde pustit s libovolnym
    // JDK 17 nebo novejsim (napr. jen JDK 21 na Windows), nic dalsiho nemusi byt nainstalovane. Instalatory z jpackage
    // si pribali runtime toho JDK, kterym se stavi.
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
    }

    // Po behu testu vypise jeden souhrnny radek na modul (Gradle sam pocty do terminalu nepise). Kdyz je uloha
    // test "up-to-date", testy se nespousti a radek se nevypise; novy beh vynuti --rerun-tasks nebo cleanTest.
    tasks.withType(Test).configureEach {
        afterSuite { desc, result ->
            if (desc.parent == null) {
                println "Testy ${project.name}: ${result.testCount} celkem, ${result.failedTestCount} selhalo, " +
                        "${result.skippedTestCount} preskoceno (${result.resultType})"
            }
        }
    }

    dependencies {
        //testImplementation 'junit:junit:4.13.1'
    }
}

