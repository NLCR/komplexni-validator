/*
 * Konvence verze aplikace (appVersion v gradle.properties, viz release.md kap. 1):
 *
 *   MAJOR.MINOR[.PATCH][-dev | -alpha[N] | -beta[N] | -rc[N]]
 *
 *   3.0-alpha, 3.0-alpha2, 3.0-beta, 3.0-beta2, 3.0-rc1, 3.0, 3.0.1, 3.1-dev
 *
 * První předvydání daného stupně je bez čísla (3.0-alpha), další se číslují od 2 (3.0-alpha2); N je 1 až 99.
 * Tvar s jedničkou (3.0-rc1) je totéž co tvar bez čísla (3.0-rc), v jedné verzi se používá jen jeden z nich.
 * Přípona -dev označuje rozpracovaný stav mezi vydáními a nikdy se netaguje.
 *
 * Číselná verze pro jpackage (ext.installerVersion):
 *  - macOS a Linux: MAJOR.MINOR.PATCH (3.0-beta2 -> 3.0.0), nic se podle ní neporovnává;
 *  - Windows: třetí složka = PATCH * 1000 + stupeň, aby Windows Installer bral každé další sestavení téže verze jako
 *    vyšší a starší při instalaci nahradil (porovnává první tři složky, třetí smí být nejvýš 65535):
 *      -dev 0, -alpha[N] 100 + N, -beta[N] 200 + N, -rc[N] 300 + N, finální verze 900
 *      3.0-alpha -> 3.0.101, 3.0-alpha2 -> 3.0.102, 3.0-beta -> 3.0.201, 3.0-rc1 -> 3.0.301, 3.0 -> 3.0.900,
 *      3.0.1-beta -> 3.0.1201, 3.0.1 -> 3.0.1900
 *    Proto PATCH nejvýš 64.
 */

ext.parseAppVersion = { String version ->
    def m = (version ?: '') =~ /^(\d+)\.(\d+)(?:\.(\d+))?(?:-(dev|alpha|beta|rc)(\d*))?$/
    if (!m.matches()) {
        throw new GradleException("appVersion '${version}' neodpovídá konvenci " +
                "MAJOR.MINOR[.PATCH][-dev|-alpha[N]|-beta[N]|-rc[N]], např. 3.0-alpha, 3.0-beta2, 3.0, 3.0.1 " +
                "(viz gradle/app-version.gradle).")
    }
    String stage = m.group(4)
    String numberText = m.group(5)
    if (stage == 'dev' && numberText) {
        throw new GradleException("appVersion '${version}': přípona -dev se nečísluje.")
    }
    int number = numberText ? Integer.parseInt(numberText) : 1
    if (number < 1 || number > 99) {
        throw new GradleException("appVersion '${version}': číslo předvydání musí být 1 až 99.")
    }
    int major = Integer.parseInt(m.group(1))
    int minor = Integer.parseInt(m.group(2))
    int patch = m.group(3) ? Integer.parseInt(m.group(3)) : 0
    if (major < 1 || major > 255 || minor > 255 || patch > 64) {
        throw new GradleException("appVersion '${version}': MAJOR musí být 1 až 255, MINOR nejvýš 255 a PATCH nejvýš 64 " +
                "(omezení verze instalátoru pro Windows).")
    }
    return [major: major, minor: minor, patch: patch, stage: stage, number: number]
}

ext.installerVersion = { String version, boolean windows ->
    def v = parseAppVersion(version)
    if (!windows) {
        return "${v.major}.${v.minor}.${v.patch}".toString()
    }
    int stage
    switch (v.stage) {
        case 'dev': stage = 0; break
        case 'alpha': stage = 100 + v.number; break
        case 'beta': stage = 200 + v.number; break
        case 'rc': stage = 300 + v.number; break
        default: stage = 900
    }
    return "${v.major}.${v.minor}.${v.patch * 1000 + stage}".toString()
}

// Kontrola převodu na ručně určených příkladech (běží s testy modulu guiModule) a kontrola appVersion projektu.
ext.checkAppVersionConvention = {
    def expected = [
            // verze: [Windows, macOS a Linux]
            '3.0-dev'    : ['3.0.0', '3.0.0'],
            '3.0-alpha'  : ['3.0.101', '3.0.0'],
            '3.0-alpha1' : ['3.0.101', '3.0.0'],
            '3.0-alpha2' : ['3.0.102', '3.0.0'],
            '3.0-alpha99': ['3.0.199', '3.0.0'],
            '3.0-beta'   : ['3.0.201', '3.0.0'],
            '3.0-beta2'  : ['3.0.202', '3.0.0'],
            '3.0-rc'     : ['3.0.301', '3.0.0'],
            '3.0-rc1'    : ['3.0.301', '3.0.0'],
            '3.0-rc99'   : ['3.0.399', '3.0.0'],
            '3.0'        : ['3.0.900', '3.0.0'],
            '3.0.0'      : ['3.0.900', '3.0.0'],
            '3.0.1-dev'  : ['3.0.1000', '3.0.1'],
            '3.0.1-beta' : ['3.0.1201', '3.0.1'],
            '3.0.1'      : ['3.0.1900', '3.0.1'],
            '2.9'        : ['2.9.900', '2.9.0'],
            '12.4.64'    : ['12.4.64900', '12.4.64'],
            '255.255.64' : ['255.255.64900', '255.255.64'],
    ]
    expected.each { version, numbers ->
        def win = installerVersion(version, true)
        def other = installerVersion(version, false)
        if (win != numbers[0] || other != numbers[1]) {
            throw new GradleException("převod verze '${version}': Windows ${win} (má být ${numbers[0]}), " +
                    "ostatní ${other} (má být ${numbers[1]})")
        }
    }
    // pořadí na Windows: každé další sestavení téže verze má vyšší třetí složku
    def order = ['3.0-dev', '3.0-alpha', '3.0-alpha2', '3.0-beta', '3.0-beta2', '3.0-rc1', '3.0', '3.0.1-dev',
                 '3.0.1-alpha', '3.0.1']
    def thirds = order.collect { installerVersion(it, true).tokenize('.')[2] as int }
    for (int i = 1; i < thirds.size(); i++) {
        if (thirds[i] <= thirds[i - 1]) {
            throw new GradleException("pořadí verzí instalátoru: ${order[i]} (${thirds[i]}) není vyšší než " +
                    "${order[i - 1]} (${thirds[i - 1]})")
        }
    }
    def invalid = ['', '3', '3.0-alpha.0', '3.0-alpha.1', '3.0.0.1', '3.0beta', 'v3.0', '3.0-gamma', '3.0-dev2',
                   '3.0-alpha0', '3.0-alpha100', '0.9', '256.0', '3.256', '3.0.65', '3.0-', '3.0+1',
                   '3.0-Alpha', ' 3.0', '3.0-alpha-2']
    invalid.each { version ->
        boolean rejected = false
        try {
            parseAppVersion(version)
        } catch (GradleException e) {
            rejected = true
        }
        if (!rejected) {
            throw new GradleException("verze '${version}' měla být odmítnuta")
        }
    }
}
